    <line x1="250" y1="262" x2="244" y2="238"/>
    <line x1="262" y1="259" x2="262" y2="232"/>
    <line x1="274" y1="262" x2="280" y2="238"/>
  </g>
  <circle cx="244" cy="234" r="5" fill="#ffd23f"/>
  <circle cx="262" cy="228" r="5" fill="#ffd23f"/>
  <circle cx="280" cy="234" r="5" fill="#ffd23f"/>

  <!-- Auge -->
  <circle cx="276" cy="284" r="11" fill="#ffffff"/>
  <circle cx="279" cy="285" r="5.5" fill="#0b0420"/>
  <circle cx="277" cy="282" r="2" fill="#ffffff"/>

  <!-- Schnabel -->
  <path d="M292 296 L320 304 L292 312 Z" fill="#ff9f43"/>
  <path d="M292 305 L312 308 L292 311 Z" fill="#d77a1e"/>
