<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="80%">
      <stop offset="0%" stop-color="#3a1680"/>
      <stop offset="55%" stop-color="#1a0a44"/>
      <stop offset="100%" stop-color="#05010f"/>
    </radialGradient>
    <g id="feather">
      <line x1="0" y1="6" x2="0" y2="-150" stroke="#0fa9c0" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="0" cy="-158" rx="16" ry="22" fill="#1fd6b4"/>
      <ellipse cx="0" cy="-158" rx="10.5" ry="15.5" fill="#ffd23f"/>
      <ellipse cx="0" cy="-158" rx="6" ry="9.5" fill="#14323f"/>
      <circle cx="-2.4" cy="-162" r="2.6" fill="#eafff9"/>
    </g>
  </defs>

  <!-- Hintergrund -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="#3ff0ff" stroke-opacity="0.35" stroke-width="6"/>

  <!-- Federfächer -->
  <g>
    <use href="#feather" transform="translate(256,352) rotate(-78)"/>
    <use href="#feather" transform="translate(256,352) rotate(-58.5)"/>
    <use href="#feather" transform="translate(256,352) rotate(-39)"/>
    <use href="#feather" transform="translate(256,352) rotate(-19.5)"/>
    <use href="#feather" transform="translate(256,352) rotate(0)"/>
    <use href="#feather" transform="translate(256,352) rotate(19.5)"/>
    <use href="#feather" transform="translate(256,352) rotate(39)"/>
    <use href="#feather" transform="translate(256,352) rotate(58.5)"/>
    <use href="#feather" transform="translate(256,352) rotate(78)"/>
  </g>

  <!-- Körper -->
  <ellipse cx="256" cy="378" rx="62" ry="66" fill="#0f8fa6"/>
  <ellipse cx="256" cy="392" rx="40" ry="44" fill="#1fd6b4"/>

  <!-- Hals -->
  <path d="M256 360 Q236 326 248 300 L286 304 Q288 332 270 360 Z" fill="#2350c0"/>

  <!-- Kopf -->
  <circle cx="262" cy="288" r="34" fill="#2a5fd6"/>
  <circle cx="262" cy="288" r="34" fill="#1c3fa0" fill-opacity="0.0"/>

  <!-- Schopf (3 Fühler mit Punkten) -->
